version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: address-service-mongodb
    ports:
      - "27020:27017"
    volumes:
      - address_mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    restart: always

volumes:
  address_mongodb_data: