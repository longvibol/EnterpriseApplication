server:
  port: 8081

spring:
  application:
    name: room-owner-service

  data:
    mongodb:
      uri: mongodb://root:root@10.172.9.189:27019/roomOwner?authSource=admin

  kafka:
    bootstrap-servers: 10.172.9.189:9092,10.172.9.189:9094,10.172.9.189:9096
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        compression.type: gzip
        linger.ms: 10
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        retries: 2147483647
    properties:
      spring.json.add.type.headers: false

logging:
  level:
    root: INFO
    com.piseth.java.school: DEBUG

app:
  messaging:
    producerId: room-owner-service
    eventVersion: v1
    topics:
      roomEvents: room.events.v1
      roomDlq: room.events.v1.dlq
  outbox:
    poll-interval-ms: 1000
    max-batch: 100
    max-attempts: 12
    retention-days: 14

storage:
  minio:
    endpoint: http://10.172.9.189:9000
    accessKey: minioadmin
    secretKey: minioadmin
    bucket: room-media
    publicBaseUrl: http://10.172.9.189:9000
    maxFilesPerRoom: 10
    maxFileSizeBytes: 5000000

