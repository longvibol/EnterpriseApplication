version: '3.8'

services:
  mongodb_roomService:
    image: mongo:6.0
    container_name: mongodb_roomService
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    restart: always

volumes:
  mongodb_data: